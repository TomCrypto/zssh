[package]
name = "zssh"
edition = "2024"
version = "0.5.0"
rust-version = "1.85"
authors = ["Thomas Bénéteau <thomas@bitwise.me>"]
description = "Minimal SSH server for embedded applications."
documentation = "https://docs.rs/zssh"
repository = "https://github.com/TomCrypto/zssh"
license = "MIT"
readme = "README.md"
categories = ["embedded", "network-programming", "no-std", "no-std::no-alloc"]
keywords = ["ssh", "security", "cryptography"]
exclude = ["/examples"]

[dependencies]
chacha20 = { version = "0.10", default-features = false, features = ["legacy"] }
constant_time_eq = { version = "0.6", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
poly1305 = { version = "0.9", default-features = false }
rand = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3.0", default-features = false }

[dev-dependencies]
embedded-io-async = { version = "0.7", features = ["std"] }
hex = "0.4"
rand = { version = "0.10", features = ["std"] }
tokio = { version = "1.53", features = ["net", "io-util", "rt-multi-thread", "macros"] }
